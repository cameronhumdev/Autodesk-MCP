apiVersion: apps/v1
kind: Deployment
metadata:
  name: anythingllm
  namespace: autodesk-mcp-demo
  labels:
    app: anythingllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anythingllm
  template:
    metadata:
      labels:
        app: anythingllm
    spec:
      containers:
        - name: anythingllm
          image: mintplexlabs/anythingllm:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: STORAGE_DIR
              value: /app/server/storage
            # Host Ollama via Docker Desktop / kind special DNS
            - name: LLM_PROVIDER
              value: ollama
            - name: OLLAMA_BASE_PATH
              value: http://host.docker.internal:11434
            - name: OLLAMA_MODEL_PREF
              value: qwen2.5:7b
            - name: EMBEDDING_ENGINE
              value: native
            - name: VECTOR_DB
              value: lancedb
          volumeMounts:
            - name: storage
              mountPath: /app/server/storage
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            capabilities:
              add: ["SYS_ADMIN"]
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: anythingllm-storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anythingllm-storage
  namespace: autodesk-mcp-demo
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: anythingllm
  namespace: autodesk-mcp-demo
spec:
  type: NodePort
  selector:
    app: anythingllm
  ports:
    - name: http
      port: 3001
      targetPort: http
      nodePort: 30080
